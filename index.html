<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Valorant Stream Overlay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="overlay">
    <section class="stat rank">
      <span id="rank">IMMORTAL 1</span>
      <small><span id="rr">0</span> RR</small>
    </section>
    <section class="stat"><strong id="wins">0</strong><small>W</small></section>
    <section class="stat"><strong id="losses">0</strong><small>L</small></section>
    <section class="stat"><strong id="wr">0%</strong><small>WR</small></section>
    <section class="stat"><strong id="kd">1.00</strong><small>K/D</small></section>
  </main>
  <script src="script.js"></script>
</body>
</html>
