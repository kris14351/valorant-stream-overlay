<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Valorant Stream Overlay</title><link rel="stylesheet" href="style.css"></head>
<body><main class="panel">
<div class="topline"><span class="accent"></span><span class="eyebrow">PLAYER STATS</span><span class="live"><i></i> LIVE</span></div>

</main><script src="script.js"></script></body></html>
